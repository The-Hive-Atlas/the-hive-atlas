# Updates the Visitors panel (data/visitors.json) from GoatCounter once a day.
# Needs the repository secret GOATCOUNTER_TOKEN (a GoatCounter API token with "Read statistics" only).
# Run it by hand any time from the Actions tab: "Update visitor counts" > Run workflow.
name: Update visitor counts

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visitors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch counts from GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_SITE: mohamedalburaki
        run: python3 pipeline/build_visitors.py

      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/visitors.json ]; then git add data/visitors.json; fi
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Update visitor counts"
          git push
